---
# ASDLC External-Authority Freshness Register — machine-readable source of truth.
#
# Tracks every external authority (regulation, standard, framework, guidance)
# that ASDLC cites. Each entry records publication metadata, the date the
# citation was last verified against the authoritative source, and the date
# by which it must be re-verified or escalated.
#
# Why: governance authorities themselves drift. ISO standards revise, OWASP
# top-tens re-rank, regulations gain delegated acts, and guidance documents
# get superseded. ASDLC's currency depends on its citations' currency. This
# register is itself a governance artefact and falls under Governance of
# Governance recursion (asdlc.md, governance/agents.md).
#
# Companion human-readable view: freshness-register.md.
#
# Cadence policy:
#   - Default: 6 months between verifications.
#   - Security-fast-moving (OWASP top-tens, adversarial-ML taxonomies): 3 months.
#   - Slow-moving foundational (mature ISO standards, decade-stable
#     directives): 12 months.
# An entry whose `next_review_due` has passed without re-verification is
# stale and MUST be either re-verified or escalated to the ASDLC Steward.

schema_version: "1.0"
asdlc_version: "0.1.0"
last_updated: "2026-05-07"
register_owner: "ASDLC Steward"

# Cadence enum — the allowed review cadences. The `next_review_due` of every
# entry is computed from `last_verified` plus the entry's cadence.
cadence_enum:
  - 3_months
  - 6_months
  - 12_months

